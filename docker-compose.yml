# MjengoOS — single-node self-host (SQLite + local disk uploads).
#
#   cp .env.example .env        # set NEXTAUTH_SECRET (openssl rand -hex 32)
#                                #   and JOBS_RUN_TOKEN (same command) to
#                                #   enable the jobs-tick scheduler below
#   docker compose up -d --build
#   → http://localhost:3000     (migrations apply automatically on boot)
#   → http://localhost:3000/website   (marketing site, proxied by the app)
#
# Three services: `app` (this repo's Next.js application), `website` (the
# mjengoos-website/ marketing site) and `jobs-tick` (a busybox sidecar that
# drains the background-job queue on a 5-minute schedule — POST /api/jobs/run
# with the JOBS_RUN_TOKEN bearer credential; see DEPLOYMENT.md §7.3 "Background
# jobs scheduler"). The website is NOT published to the host —
# the app proxies /website/* to it via its next.config.ts rewrite, pointed at
# WEBSITE_ORIGIN=http://website:3001 (compose service DNS) below. One origin,
# one cookie domain: the site's "Sign in" lands on the app's login screen.
#
# DATABASE_URL below OVERRIDES the host path from .env so the database lives
# in the named volume app-db (→ /app/db/custom.db inside the container).
# Behind a reverse proxy: keep NEXTAUTH_URL unset and AUTH_TRUST_HOST=1 (see
# DEPLOYMENT.md — the PR #7 sign-in-behind-a-proxy lesson).

services:
  app:
    build: .
    image: mjengoos
    container_name: mjengoos
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env                 # JOBS_RUN_TOKEN set here reaches the app (env_file
                             #   passes everything) — the sidecar's credential
    environment:
      DATABASE_URL: "file:/app/db/custom.db"
      # /website/* rewrite target: the website service on the compose network
      # (local default when unset: http://127.0.0.1:3001 — see DEPLOYMENT.md §3).
      WEBSITE_ORIGIN: "http://website:3001"
      # Fixed public domain instead of a proxy? Set in .env:
      #   NEXTAUTH_URL=https://your-domain.example
    volumes:
      - app-db:/app/db                 # SQLite database (back this up!)
      - app-photos:/app/public/photos  # POST /api/upload photo uploads
      # - app-docs:/app/public/docs    # documents module writes here (optional)
    healthcheck:
      # node:20-slim has no curl/wget — node's global fetch does the probe.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  website:
    build:
      context: ./mjengoos-website
      # The image builds in integrated mode by default (build ARGs
      # NEXT_PUBLIC_BASE_PATH=/website + NEXT_PUBLIC_APP_URL=/). For a
      # standalone site on its own domain, override them:
      #   args:
      #     NEXT_PUBLIC_BASE_PATH: ""
      #     NEXT_PUBLIC_APP_URL: "https://app.yourdomain.example"
    image: mjengoos-website
    container_name: mjengoos-website
    restart: unless-stopped
    # Internal only — reached through the app's /website/* rewrite
    # (WEBSITE_ORIGIN above). Publish a host port via a compose override
    # file only if you need direct access to the site's origin.
    expose:
      - "3001"
    volumes:
      - website-data:/app/data     # contact-form submissions (POST /website/api/contact)
    healthcheck:
      # node:20-slim has no curl/wget — node's global fetch does the probe.
      # /website matches the default integrated build (basePath baked at
      # build time) — adjust if you override the build args.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/website').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # Background-job scheduler sidecar: POSTs the drain endpoint
  # (/api/jobs/run) every 5 minutes over the compose network so the
  # JobRecord queue (anomaly scan, weekly digest, reconciliation, overdue
  # check) does not wait for a human to open the Intel "Background jobs"
  # card. The machine credential is checked in constant time by the app
  # (src/backend/lib/jobs-token.ts); the app reads the token from .env via
  # its env_file above, this sidecar reads the SAME value from .env via
  # compose interpolation below — one file, both sides. Without the token
  # in .env the app's bearer path is disabled (fail closed) and every tick
  # 401s — the loop says so at startup. Cadence: sleep 300 (5 minutes,
  # 50x under the endpoint's 10/min rate-limit bucket). No healthcheck by
  # design: the loop itself is the liveness — `docker compose logs
  # jobs-tick` shows every failed drain (successful ones are silent, like
  # a cron); restart: unless-stopped revives the container if it dies.
  jobs-tick:
    image: busybox:1.37
    container_name: mjengoos-jobs-tick
    restart: unless-stopped
    environment:
      JOBS_RUN_TOKEN: "${JOBS_RUN_TOKEN:-}"
    # busybox wget syntax verified against busybox 1.35: multiple --header
    # flags accumulate, --post-data sets the body, -T is the timeout, and a
    # non-2xx response (or a refused connection) exits non-zero.
    command:
      - /bin/sh
      - -c
      - |
        if [ -z "$$JOBS_RUN_TOKEN" ]; then
          echo "jobs-tick: JOBS_RUN_TOKEN is not set - the app will reject every drain (401)."
          echo "jobs-tick: generate one (openssl rand -hex 32), add JOBS_RUN_TOKEN=<it> to .env,"
          echo "jobs-tick: then: docker compose up -d app jobs-tick"
        fi
        echo "jobs-tick: draining http://app:3000/api/jobs/run every 300s (5 min)"
        while true; do
          wget -q -O - -T 90 \
            --header "Authorization: Bearer $$JOBS_RUN_TOKEN" \
            --header "Content-Type: application/json" \
            --post-data '{}' \
            http://app:3000/api/jobs/run \
            >/dev/null 2>&1 \
            || echo "$$(date -u '+%Y-%m-%dT%H:%M:%SZ') jobs-tick: drain failed (app down, booting, or token rejected) - next tick in 300s"
          sleep 300
        done

volumes:
  app-db:
  app-photos:
  website-data:
