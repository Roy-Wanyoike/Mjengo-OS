<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MjengoOS — offline</title>
  <meta name="theme-color" content="#1c1917" />
  <style>
    /* Self-contained (served by the service worker with no network): the app's
       stone palette, amber accent, system monospace. */
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #fafaf9;          /* stone-50 */
      color: #1c1917;               /* stone-950 */
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .card {
      max-width: 420px;
      width: 100%;
      border: 1px solid #e7e5e4;    /* stone-200 */
      border-radius: 16px;
      background: #ffffff;
      box-shadow: 0 1px 2px rgba(28, 25, 23, 0.06);
      padding: 32px 28px;
      text-align: center;
    }
    .mark {
      width: 56px; height: 56px;
      margin: 0 auto 16px;
      border-radius: 14px;
      background: #1c1917;
      display: flex; align-items: center; justify-content: center;
    }
    .mark svg { width: 34px; height: 34px; }
    h1 { margin: 0 0 8px; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
    p { margin: 0 0 20px; font-size: 14px; line-height: 1.6; color: #57534e; /* stone-600 */ }
    p strong { color: #1c1917; }
    .queue {
      display: block;
      margin: 0 0 20px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #fef3c7;          /* amber-100 */
      border: 1px solid #fde68a;    /* amber-200 */
      color: #78350f;               /* amber-900 */
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      line-height: 1.5;
      text-align: left;
    }
    button {
      appearance: none;
      border: 0;
      border-radius: 10px;
      background: #1c1917;
      color: #fafaf9;
      font: inherit;
      font-weight: 600;
      padding: 12px 22px;
      min-height: 44px;
      cursor: pointer;
    }
    button:focus-visible { outline: 2px solid #d97706; outline-offset: 2px; }
    .hint { margin-top: 16px; font-size: 12px; color: #a8a29e; }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">
      <!-- amber hard-hat, same mark as the PWA icons -->
      <svg viewBox="0 0 24 24" fill="none" role="img">
        <rect x="10.6" y="5.2" width="2.8" height="2.4" rx="1.2" fill="#fbbf24"/>
        <path d="M5.5 14.2v-1.7a6.5 6.5 0 0 1 13 0v1.7Z" fill="#f59e0b"/>
        <rect x="3.6" y="15.6" width="16.8" height="1.9" rx="0.95" fill="#f59e0b"/>
      </svg>
    </div>
    <h1>You&rsquo;re offline</h1>
    <p>MjengoOS keeps saving to the <strong>on-device queue</strong>. Records you capture now sync automatically once the network returns.</p>
    <span class="queue">offline → queue → sync (money &amp; evidence actions replay from the outbox)</span>
    <button type="button" onclick="window.location.replace('/')">Retry connection</button>
    <p class="hint">This page was served from the device by the MjengoOS service worker.</p>
  </main>
</body>
</html>
