# MjengoOS — Vitest unit suite (Task 5-e).
# Real invariant tests over the shared permission matrix, the client-action
# allowlist, i18n dictionaries, rate limiting, the 3-way invoice match and the
# double-entry ledger. Runs on every push/PR to main; no database or secrets
# required — the tests are pure/unit-level by design.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Vitest unit suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests (vitest run)
        run: bun run test
